[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citadel-rag"
version = "0.1.0"
description = "Citation-contradiction detection for RAG: when retrieved sources disagree, surface it honestly instead of silently picking a side"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Habib Ur Rehman" }]
requires-python = ">=3.10"
dependencies = ["scikit-learn>=1.3"]
keywords = ["rag", "contradiction-detection", "nli", "citations", "llm-agents"]

[project.urls]
Homepage = "https://github.com/habib-analyst/citadel-rag"

[tool.setuptools.packages.find]
where = ["src"]
